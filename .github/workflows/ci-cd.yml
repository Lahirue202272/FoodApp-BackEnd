name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inject secrets into task definition
        run: |
          sed -i "s|PLACEHOLDER_DB_URL|${{ secrets.PROD_DB_URL }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_DB_USERNAME|${{ secrets.PROD_DB_USERNAME }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_DB_PASSWORD|${{ secrets.PROD_DB_PASSWORD }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_JWT_SECRET|${{ secrets.JWT_SECRET }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_MAIL_USER|${{ secrets.MAIL_USER }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_MAIL_PASS|${{ secrets.MAIL_PASS }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_BUCKET_NAME|${{ secrets.AWS_BUCKET_NAME }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_ACCESS_KEY|${{ secrets.AWS_ACCESS_KEY }}|g" foodapp-backend-task-definition.json
          sed -i "s|PLACEHOLDER_SECRET_KEY|${{ secrets.AWS_SECRETE_KEY }}|g" foodapp-backend-task-definition.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: foodapp-backend
        run: |
          # Docker build itself runs the Maven build inside the Dockerfile's
          # builder stage, so there's no need to build the jar separately here.
          docker build -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$REPOSITORY:latest .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: foodapp-backend-task-definition.json
          container-name: foodapp-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: foodapp-backend-service
          cluster: foodapp-backend-dev
          wait-for-service-stability: true
#MYSQL PODUCTION CONNECTION
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



secretJwtString=${JWT_SECRET}

## Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


## AWS CONFIG
aws.s3.region=ap-south-1
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRETE_KEY}


##LOCAL REACT FRONTEND
base.payment.link=http://localhost:3000/pay?orderid=
frontend.base.url=http://localhost:3000


